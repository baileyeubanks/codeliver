<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Master desktop — inside a project</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./desktop.css" />
</head>
<body class="shot">
  <main class="desk-stage"><div data-desk="project"></div></main>
  <script src="./desktop.js"></script>
  <script>
    const player = document.querySelector(".player");
    if (player) {
      player.querySelector("b").textContent = "Live thin overlay";
      player.querySelector("span").textContent = "Unchanged. Dialog at the playhead.";
    }
    const under = document.querySelector(".work .panel .notes");
    if (under) under.remove();
  </script>
</body>
</html>
