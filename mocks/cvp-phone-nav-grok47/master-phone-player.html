<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Master phone — film, app bar hidden</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./master.css" />
</head>
<body class="shot">
  <main class="stage">
    <article class="phone">
      <div class="film">
        <div class="status">
          <span>9:41</span>
          <span class="status-icons" aria-hidden="true"></span>
        </div>
        <div class="film-top">
          <button type="button" aria-label="Back to Harbor Light Cut">‹ Harbor Light · Cut</button>
        </div>
        <div class="stage-fill" role="img" aria-label="Live thin player, unchanged">
          <span class="tap">Live thin overlay stays. Tap the frame.</span>
          <div class="comment-dialog" role="dialog" aria-label="Comment at the playhead">
            <strong>00:12</strong>
            <span>Comment at the playhead. No dock under the film.</span>
          </div>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
