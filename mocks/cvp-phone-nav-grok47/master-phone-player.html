<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Master phone — film, app bar hidden</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./master.css" />
</head>
<body class="shot">
  <main class="stage">
    <article class="phone">
      <div class="film">
        <div class="status">
          <span>9:41</span>
          <span class="status-icons" aria-hidden="true"></span>
        </div>
        <div class="film-top">
          <button type="button" aria-label="Back to Harbor Light Cut">‹ Harbor Light · Cut</button>
        </div>
        <div class="stage-fill" role="img" aria-label="Review frame">
          <span class="tap">Tap the frame to comment · 00:12</span>
        </div>
        <div class="transport" aria-label="Player">
          <button class="play" type="button" aria-label="Play">
            <svg width="11" height="11" viewBox="0 0 12 12"><path d="M3 1.6 10.2 6 3 10.4z" fill="#fff"/></svg>
          </button>
          <span class="track" aria-hidden="true"><i></i></span>
          <span>00:12 / 02:40</span>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
