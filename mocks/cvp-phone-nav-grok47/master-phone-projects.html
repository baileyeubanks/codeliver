<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Master phone — Projects</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./master.css" />
</head>
<body class="shot">
  <main class="stage"><div data-phone="closed"></div></main>
  <script src="./phone.js"></script>
  <script>
    const list = document.querySelector(".list");
    const head = list.querySelector(".list-head");
    const chips = document.createElement("div");
    chips.className = "chips";
    chips.setAttribute("aria-label", "Filter projects by stage");
    chips.innerHTML = ["All","Brief","Shoot","Cut","Delivery"].map((name, i) =>
      `<button type="button" ${i === 0 ? 'aria-pressed="true"' : 'aria-pressed="false"'}>${name}</button>`).join("");
    head.after(chips);
  </script>
</body>
</html>
